name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true
          modules: 'qtimageformats'

      - name: Build qView
        shell: pwsh
        run: dist/scripts/build.ps1 -CI

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # No NightlyVersion argument, so windeployqt.ps1 packages the tree with dist/win/qView.iss
      - name: Deploy and package
        shell: pwsh
        env:
          buildArch: x64
        run: |
          & dist/scripts/download-plugins.ps1
          & dist/scripts/windeployqt.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: qview-installer-win64
          path: bin/qView-*.exe
